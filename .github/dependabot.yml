# ABOUTME: Dependabot version updates for the GitHub Actions and npm dependencies.
# ABOUTME: Weekly; npm minor and patch bumps arrive grouped, majors one PR each.
# SPDX-FileCopyrightText: 2026 Michel Oosterhof
# SPDX-License-Identifier: CC0-1.0

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint does not load under TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
