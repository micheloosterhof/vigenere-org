# ABOUTME: Deploys the site to GitHub Pages once CI has passed on main, building exactly the commit CI tested.
# ABOUTME: A manual run (workflow_dispatch) deploys the current main without waiting for CI.
# SPDX-FileCopyrightText: 2026 Michel Oosterhof
# SPDX-License-Identifier: CC0-1.0
name: Deploy to GitHub Pages

on:
  # Deploy only after the CI workflow finishes for a push to main; the job
  # condition below skips runs where CI failed or was cancelled.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deployments instead of cancelling one that is already live-updating
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
          PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
